baseURL = "https://jyooi.com/"
defaultContentLanguage = "en"
[languages.en]
locale = "en"
enableEmoji = true
enableRobotsTXT = true

title = "jyooi // jia yi ooi"

[params]
  description = "Jia Yi Ooi - engineer in Penang. Notes on building across the stack, AI infra, and agent tooling. React, TypeScript, FastAPI, Kubernetes, Elixir."
  metaKeywords = ["Jia Yi Ooi", "jyooi", "engineer", "Penang", "notes", "React", "TypeScript", "FastAPI", "Kubernetes", "Elixir", "Zig", "AI infra", "agents"]
  resume = "/JiaYi_Ooi_Resume.pdf"

  customHeadHTML = """
<script async src="https://omarchysettlement.tail4d678f.ts.net/js/pa-jIFX9EiAhi4p49SJ95Jp0.js"></script>
<script>
window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
plausible.init()
</script>
"""

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "robots"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false
    guessSyntax = true
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
