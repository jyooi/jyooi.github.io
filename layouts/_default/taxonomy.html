{{ define "main" }}
<section class="section" id="notes">
  <div class="section__head">
    <span class="section__prompt">$</span>
    <span class="section__cmd">grep -l "#{{ .Title | lower }}" ~/notes/*</span>
    <span class="section__hint"><a href="/notes/">all notes</a></span>
  </div>
  <pre class="section__rule" aria-hidden="true">────────────────────────────────────────────────────────────────────────────────</pre>
  {{ partial "note-list.html" (dict "pages" .Pages "empty" "nothing tagged yet.") }}
</section>
{{ end }}
